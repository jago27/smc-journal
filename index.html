  const maxEq=Math.max(...equity.map(e=>e.val),1);

      equity.length>1?React.createElement("svg",{width:"100%",viewBox:`0 0 ${W} ${H}`},
        React.createElement("defs",null,React.createElement("linearGradient",{id:"eg",x1:"0",y1:"0",x2:"0",y2:"1"},React.createElement("stop",{offset:"0%",stopColor:C.accent,stopOpacity:"0.3"}),React.createElement("stop",{offset:"100%",stopColor:C.accent,stopOpacity:"0"}))),
        React.createElement("polyline",{points:pts,fill:"none",stroke:C.accent,strokeWidth:"2",strokeLinejoin:"round"}),
